[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "btcbasics"
version = "0.1.0"
description = "SHA-256d, HASH160, Base58Check, Bech32, Bech32m, BIP 32, BIP 39 and Bitcoin address helpers in plain Python"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
classifiers = ["Typing :: Typed"]

[project.scripts]
btcbasics = "btcbasics.__main__:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["btcbasics"]

[tool.setuptools.package-data]
btcbasics = ["py.typed", "wordlists/english.txt"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
