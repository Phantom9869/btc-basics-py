[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "btcbasics"
version = "0.1.0"
description = "SHA-256d, HASH160 and Base58Check address encoding in plain Python"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
btcbasics = "btcbasics.__main__:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["btcbasics"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
